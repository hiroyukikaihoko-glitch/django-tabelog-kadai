<div class="py-1 bg-dark ">
  <nav class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
    <a class="py-2 text-white" href="/">{{ TITLE }}</a>
    <a class="py-2 d-none d-md-inline-block text-white" href="/orders/">Orders</a>
    <a class="py-2 d-none d-md-inline-block text-white" href="/profile/">Profile</a>
    <a class="py-2 d-none d-md-inline-block text-white" href="/account/">Account</a>
    <a class="py-2 d-none d-md-inline-block text-white" href="/cart/">Cart
      {% if request.session.cart and request.session.cart.items|length != 0 %}
      <span class="badge badge-danger">{{request.session.cart.items|length}}</span>
      {% endif %}
    </a>
  
    {% if user.is_authenticated %}
    <!-- ログアウト部分を安全なPOSTフォームに変更（見た目は他のリンクと同じになります） -->
    <form action="{% url 'logout' %}" method="post" class="d-none d-md-inline-block m-0 p-0">
      {% csrf_token %}
      <button type="submit" class="py-2 text-white btn btn-link text-decoration-none shadow-none" style="border: none; background: none; font: inherit;">
        Logout
      </button>
    </form>
    {% else %}
    <a class="py-2 d-none d-md-inline-block text-white" href="/login/">Login</a>
    <a class="py-2 d-none d-md-inline-block text-white" href="/signup/">SignUp</a>
    {% endif %}
  </nav>
</div>
