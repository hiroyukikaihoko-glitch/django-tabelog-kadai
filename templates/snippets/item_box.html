<a href="/items/{{object.pk}}/">
  <div class="border">
    {% if object.image %}
      <img src="{{ object.image.url }}" width="100%" class=" bg-white">
    {% else %}
      <div class="bg-secondary text-white text-center py-5">No Image</div>
    {% endif %}
    <div class="bg-light text-center text-secondary overflow-hidden">
      <div class="my-2 py-2">
        <h2 class="lead">{{object.name}} - ¥{{object.price}}</h2>
      </div>
    </div>
  </div>
</a>
